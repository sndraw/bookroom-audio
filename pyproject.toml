[project]
name = "bookroom-audio"
version = "0.0.7"
description = "API for audio transcription, text-to-speech, and video content analysis using AI models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "sndraw" },
]

dependencies = [
    "argparse>=1.4.0",
    "ascii-colors>=0.5.2",
    "chattts>=0.0.9",
    "dotenv>=0.9.9",
    "edge-tts>=6.1.9",
    "einx>=0.4.3",
    "fastapi>=0.115.11",
    "faster-whisper>=1.1.1",
    "openai-whisper>=20240930",
    "pydub>=0.25.1",
    "python-multipart>=0.0.20",
    "pyttsx3>=2.99",
    "qwen-asr>=0.0.6",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "uvicorn>=0.34.0",
    "vector-quantize-pytorch>=1.29.1",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "pillow>=10.0.0",
    "modelscope>=1.37.1",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["bookroom_audio"]
exclude = []
