services:
  bookroom_audio:
    build: .
    ports:
      - "${EXPOSE_PORT:-15231}:${PORT:-15231}"
    volumes:
      - ./.cache:/app/.cache
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-15231}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"